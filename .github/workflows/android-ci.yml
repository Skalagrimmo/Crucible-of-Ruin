name: Android CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build-and-test:
    name: Unit tests and debug build
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      # Firebase credentials are intentionally not committed. This placeholder is only
      # used to compile and run offline/unit tests; sign-in must use a real local config.
      - name: Provide placeholder google-services.json for CI
        if: hashFiles('app/google-services.json') == ''
        shell: bash
        run: |
          cat > app/google-services.json <<'JSON'
          {
            "project_info": {
              "project_number": "000000000000",
              "project_id": "crucible-of-ruin-ci",
              "storage_bucket": "crucible-of-ruin-ci.appspot.com"
            },
            "client": [
              {
                "client_info": {
                  "mobilesdk_app_id": "1:000000000000:android:0000000000000000",
                  "android_client_info": {
                    "package_name": "com.skalagrimmo.crucibleofruin"
                  }
                },
                "oauth_client": [
                  {
                    "client_id": "000000000-placeholder0000000000000000000000000000.apps.googleusercontent.com",
                    "client_type": 3
                  }
                ],
                "api_key": [
                  {
                    "current_key": "AIzaSyCI-placeholder-key-for-compilation-0000000000"
                  }
                ],
                "services": {
                  "appinvite_service": {
                    "other_platform_oauth_client": []
                  }
                }
              }
            ],
            "configuration_version": "1"
          }
          JSON

      - name: Run unit tests
        shell: bash
        run: |
          set -o pipefail
          ./gradlew :app:testDebugUnitTest --stacktrace --no-daemon 2>&1 | tee build-output.log

      - name: Build debug APK
        shell: bash
        run: |
          set -o pipefail
          ./gradlew :app:assembleDebug --stacktrace --no-daemon 2>&1 | tee -a build-output.log

      # This APK is built with a placeholder Firebase config when the real config is absent.
      # It is suitable for offline/gameplay smoke tests, but real Google Sign-In/cloud sync
      # require the application's actual google-services.json.
      - name: Upload debug APK artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: crucible-of-ruin-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: android-ci-diagnostics
          if-no-files-found: ignore
          path: |
            build-output.log
            app/build/reports/tests/
            app/build/test-results/testDebugUnitTest/
