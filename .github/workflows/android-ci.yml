name: Android CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build-and-test:
    name: Unit tests and debug build
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      # Firebase credentials are intentionally not committed. This placeholder is only
      # used to compile and run offline/unit tests; sign-in must use a real local config.
      - name: Provide placeholder google-services.json for CI
        if: hashFiles('app/google-services.json') == ''
        shell: bash
        run: |
          cat > app/google-services.json <<'JSON'
          {
            "project_info": {
              "project_number": "000000000000",
              "project_id": "crucible-of-ruin-ci",
              "storage_bucket": "crucible-of-ruin-ci.appspot.com"
            },
            "client": [
              {
                "client_info": {
                  "mobilesdk_app_id": "1:000000000000:android:0000000000000000",
                  "android_client_info": {
                    "package_name": "com.skalagrimmo.crucibleofruin"
                  }
                },
                "oauth_client": [
                  {
                    "client_id": "000000000000-placeholder0000000000000000000000000000.apps.googleusercontent.com",
                    "client_type": 3
                  }
                ],
                "api_key": [
                  {
                    "current_key": "AIzaSyCI-placeholder-key-for-compilation-0000000000"
                  }
                ],
                "services": {
                  "appinvite_service": {
                    "other_platform_oauth_client": []
                  }
                }
              }
            ],
            "configuration_version": "1"
          }
          JSON

      - name: Run unit tests
        shell: bash
        run: |
          set -o pipefail
          ./gradlew :app:testDebugUnitTest --stacktrace --no-daemon 2>&1 | tee build-output.log

      # TEMPORARY (diagnostics): surface failing tests / compile errors as public
      # annotations so failures are visible outside authenticated log downloads.
      - name: Report failures as annotations
        if: failure()
        shell: bash
        run: |
          python3 - <<'PY'
          import glob, os
          import xml.etree.ElementTree as ET

          CR = chr(13)
          LF = chr(10)

          def esc(s):
              return s.replace('%', '%25').replace(CR, '%0D').replace(LF, '%0A')

          found = 0
          for f in glob.glob('app/build/test-results/testDebugUnitTest/*.xml'):
              try:
                  root = ET.parse(f).getroot()
              except Exception:
                  continue
              for tc in root.iter('testcase'):
                  cls = tc.get('classname') or os.path.basename(f)
                  name = tc.get('name') or '?'
                  for kind in ('failure', 'error'):
                      for fl in tc.findall(kind):
                          msg = (fl.get('message') or (fl.text or ''))[:400]
                          print('::error title=' + esc(cls) + '.' + esc(name) + '::' + kind.upper() + ': ' + esc(msg))
                          found += 1
          if not found:
              if os.path.exists('build-output.log'):
                  hits = []
                  for l in open('build-output.log', encoding='utf-8', errors='replace'):
                      if ('e: ' in l or 'FAILED' in l or 'error:' in l.lower() or 'Exception' in l):
                          hits.append(l.strip()[:400])
                  for l in hits[:40]:
                      print('::error::' + esc(l))
                  if not hits:
                      print('::error::No failing tests and no error lines found in build-output.log')
              else:
                  print('::error::No JUnit results and no build-output.log found')
          PY

      - name: Build debug APK
        shell: bash
        run: |
          set -o pipefail
          ./gradlew :app:assembleDebug --stacktrace --no-daemon 2>&1 | tee -a build-output.log

      # This APK is built with a placeholder Firebase config when the real config is absent.
      # It is suitable for offline/gameplay smoke tests, but real Google Sign-In/cloud sync
      # require the application's actual google-services.json.
      - name: Upload debug APK artifact
        if: success()
        uses: actions/upload-artifact@v7
        with:
          name: crucible-of-ruin-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: android-ci-diagnostics
          if-no-files-found: ignore
          path: |
            build-output.log
            app/build/reports/tests/
            app/build/test-results/testDebugUnitTest/
