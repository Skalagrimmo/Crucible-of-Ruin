name: Android CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  wrapper:
    name: Ensure Gradle wrapper
    runs-on: ubuntu-latest
    if: github.event_name == 'push'
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Bootstrap wrapper if missing
        run: |
          if [ -f gradle/wrapper/gradle-wrapper.jar ]; then
            echo "Gradle wrapper already present."
            exit 0
          fi
          gradle wrapper --gradle-version 9.3.1
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add gradlew gradlew.bat gradle/wrapper
          git commit -m "chore: bootstrap Gradle wrapper via CI"
          git push
          echo "Wrapper committed to main."

  build-and-test:
    name: Unit tests and debug build
    needs: [wrapper]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Checkout (latest main includes wrapper commit)
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'push' && 'main' || github.event.pull_request.head.sha }}

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Provide placeholder google-services.json for CI build
        if: hashFiles('app/google-services.json') == ''
        run: |
          cat > app/google-services.json <<'JSON'
          {
            "project_info": {
              "project_number": "000000000000",
              "project_id": "crucible-of-ruin-ci",
              "storage_bucket": "crucible-of-ruin-ci.appspot.com"
            },
            "client": [
              {
                "client_info": {
                  "mobilesdk_app_id": "1:000000000000:android:0000000000000000",
                  "android_client_info": {
                    "package_name": "com.example"
                  }
                },
                "oauth_client": [
                  {
                    "client_id": "000000000-placeholder0000000000000000000000000000.apps.googleusercontent.com",
                    "client_type": 3
                  }
                ],
                "api_key": [
                  {
                    "current_key": "AIzaSyCI-placeholder-key-for-compilation-0000000000"
                  }
                ],
                "services": {
                  "appinvite_service": {
                    "other_platform_oauth_client": []
                  }
                }
              }
            ],
            "configuration_version": "1"
          }
          JSON

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Run unit tests
        shell: bash
        run: |
          set -o pipefail
          gradle :app:testDebugUnitTest --stacktrace 2>&1 | tee build-output.log

      - name: Report failure output to PR
        if: failure() && github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          {
            echo "**❌ CI failed on \`testDebugUnitTest\`**"
            echo ""
            echo "**Extracted errors and causes:**"
            echo '~~~'
            grep -n -E 'e: |error:|FAILURE|What went wrong|Could not|Caused by|required:|found:' build-output.log | grep -v 'at org.gradle' | tail -n 100 || true
            echo '~~~'
            echo ""
            echo "**Last 60 lines of build output:**"
            echo '~~~'
            tail -n 60 build-output.log
            echo '~~~'
          } > comment-body.md
          gh pr comment "$PR_NUMBER" --body-file comment-body.md

      - name: Build debug APK
        run: gradle :app:assembleDebug --stacktrace

      - name: Upload test reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: app/build/reports/tests/
          if-no-files-found: ignore
